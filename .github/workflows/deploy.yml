name: CI/CD Claim Checker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check HF API key
        run: |
          if [ -z "${{ secrets.HF_API_KEY }}" ]; then
            echo "HF_API_KEY is not set!"
            exit 1
          else
            echo "HF_API_KEY found."
          fi

      - name: Run basic tests
        run: |
          echo "No tests defined yet. Add pytest later if needed."

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to Railway
        uses: railwayapp/railway-action@v1
        with:
          apiKey: ${{ secrets.RAILWAY_API_KEY }}
          projectId: <YOUR_PROJECT_ID>
          serviceId: <YOUR_SERVICE_ID>
