<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        h1 {
            color: #9b59b6;
        }
        textarea {
            width: 100%;
            max-width: 600px;
            height: 120px;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            margin-bottom: 20px;
        }
        button {
            background: #9b59b6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #8e44ad;
        }
        #result {
            margin-top: 20px;
            max-width: 600px;
            padding: 15px;
            background: #2c2c3e;
            border-radius: 5px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>Claim Checker</h1>
    <textarea id="inputText" placeholder="Enter text to analyze..."></textarea>
    <button onclick="analyzeText()">Analyze</button>
    <div id="result"></div>

    <script>
        async function analyzeText() {
            const text = document.getElementById('inputText').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Analyzing...";

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `<pre>${JSON.stringify(data.result, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `Error: ${data.error}`;
                }
            } catch (err) {
                resultDiv.innerHTML = `Fetch error: ${err}`;
            }
        }
    </script>
</body>
</html>
