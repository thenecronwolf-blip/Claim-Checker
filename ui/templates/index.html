<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Checker</title>
    <style>
        /* --- 1. THE DEEP SPACE GRADIENT ANIMATION --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            margin: 0;
            min-height: 100vh;
            /* The Gradient Magic */
            background: linear-gradient(-45deg, #1e1e2f, #2c2c3e, #1a1a2e, #0f0f1a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- UI ELEMENTS --- */
        h1 { 
            font-size: 3em; 
            margin-bottom: 10px; 
            background: linear-gradient(to right, #9b59b6, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        textarea {
            width: 100%;
            max-width: 600px;
            height: 120px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); /* Glass effect */
            backdrop-filter: blur(5px);
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        textarea:focus { border-color: #9b59b6; box-shadow: 0 0 15px rgba(155, 89, 182, 0.3); }

        button {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(155, 89, 182, 0.5); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- RESULTS CARD --- */
        #result { 
            opacity: 0; 
            transition: opacity 0.5s; 
            margin-top: 30px; 
            max-width: 600px; 
            width: 100%; 
        }

        .result-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- METERS --- */
        .meter-container { width: 100%; background: rgba(255,255,255,0.1); height: 12px; border-radius: 6px; margin-top: 8px; overflow: hidden; }
        .meter-fill { height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1); border-radius: 6px; }

        /* --- LOADING STATUS --- */
        #statusText {
            margin-top: 15px;
            font-family: monospace;
            color: #9b59b6;
            height: 20px;
        }

        /* --- FOOTER --- */
        nav a { color: rgba(255,255,255,0.7); margin: 0 15px; text-decoration: none; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: #9b59b6; }
    </style>
</head>
<body>

    <nav style="margin-bottom: 40px;">
        <a href="/">Home</a>
        <a href="/examples">Examples</a>
        <a href="/about">About</a>
        <a href="/donate" style="color: #ff4757;">♥ Donate</a>
    </nav>

    <h1>Claim Checker</h1>
    <p style="color: rgba(255,255,255,0.6); margin-top: -5px; margin-bottom: 30px;">AI-Powered Objectivity Analysis System</p>
    
    <textarea id="inputText" placeholder="Enter a statement to scan for bias patterns..."></textarea>
    <button id="analyzeBtn" onclick="startAnalysis()">Analyze System</button>
    
    <div id="statusText"></div>
    <div id="result"></div>

    <script>
        async function startAnalysis() {
            const text = document.getElementById('inputText').value.trim();
            const resultDiv = document.getElementById('result');
            const status = document.getElementById('statusText');
            const btn = document.getElementById('analyzeBtn');

            if (!text) { alert("Please input data for analysis."); return; }

            // UI Reset
            resultDiv.style.opacity = "0";
            btn.disabled = true;
            btn.textContent = "Processing...";
            
            // --- BEHAVIORAL SIMULATION (The "Thinking" Effect) ---
            const steps = ["Scanning syntax...", "Detecting emotional markers...", "Calculating subjectivity...", "Finalizing verdict..."];
            for (let i = 0; i < steps.length; i++) {
                status.innerText = steps[i];
                await new Promise(r => setTimeout(r, 400)); // 0.4s delay per step
            }
            status.innerText = "";

            try {
                // Fetch from our local Logic Engine
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                const res = data.result;

                // Render Results
                const biasColor = res.bias_score > 0.6 ? '#ff4757' : res.bias_score > 0.3 ? '#ffa502' : '#2ed573';
                
                resultDiv.innerHTML = `
                    <div class="result-card">
                        <h3 style="margin-top:0; color:white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom:15px;">Analysis Report</h3>
                        
                        <div style="margin-bottom: 20px;">
                            <div style="display:flex; justify-content:space-between;">
                                <span>Bias Intensity</span>
                                <span style="color:${biasColor}; font-weight:bold;">${(res.bias_score * 100).toFixed(0)}%</span>
                            </div>
                            <div class="meter-container"><div id="biasMeter" class="meter-fill" style="background:${biasColor}"></div></div>
                        </div>

                        <div style="margin-bottom: 25px;">
                            <div style="display:flex; justify-content:space-between;">
                                <span>System Confidence</span>
                                <span>${(res.confidence * 100).toFixed(0)}%</span>
                            </div>
                            <div class="meter-container"><div id="confMeter" class="meter-fill" style="background:linear-gradient(90deg, #9b59b6, #8e44ad)"></div></div>
                        </div>
                        
                        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px;">
                            <strong style="color:#aaa; text-transform:uppercase; font-size:0.8em;">Verdict</strong>
                            <p id="typewriterText" style="margin: 5px 0 0 0; line-height: 1.6;"></p>
                        </div>
                    </div>
                `;
                resultDiv.style.opacity = "1";

                // --- ANIMATIONS ---
                // 1. Fill Meters
                setTimeout(() => {
                    document.getElementById('biasMeter').style.width = (res.bias_score * 100) + "%";
                    document.getElementById('confMeter').style.width = (res.confidence * 100) + "%";
                }, 100);

                // 2. Typewriter Effect
                let charIndex = 0;
                const typeTarget = document.getElementById('typewriterText');
                const typeContent = res.verdict;
                typeTarget.innerHTML = ""; // Clear
                
                function type() {
                    if (charIndex < typeContent.length) {
                        typeTarget.innerHTML += typeContent.charAt(charIndex);
                        charIndex++;
                        setTimeout(type, 20); // Typing speed
                    }
                }
                type();

            } catch (err) {
                status.innerText = "System Error.";
            } finally {
                btn.disabled = false;
                btn.textContent = "Analyze System";
            }
        }
        
        // Auto-load from examples
        window.onload = function() {
            const pending = localStorage.getItem('pendingClaim');
            if (pending) {
                document.getElementById('inputText').value = pending;
                localStorage.removeItem('pendingClaim');
                startAnalysis();
            }
        }
    </script>
</body>
</html>
