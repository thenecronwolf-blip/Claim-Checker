<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        h1 {
            color: #9b59b6;
        }
        textarea {
            width: 100%;
            max-width: 600px;
            height: 120px;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            margin-bottom: 20px;
        }
        button {
            background: #9b59b6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #8e44ad;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            max-width: 600px;
            padding: 15px;
            background: #2c2c3e;
            border-radius: 5px;
            word-wrap: break-word;
            min-height: 50px;
        }
        /* Loading Spinner */
        .spinner {
            border: 4px solid #2c2c3e;
            border-top: 4px solid #9b59b6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none; /* Hidden by default */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav style="margin-bottom: 40px; text-align: center; font-size: 1.1em;">
    <a href="/" style="color: #9b59b6; margin: 0 20px; text-decoration: none;">Home</a>
    <a href="/examples" style="color: #9b59b6; margin: 0 20px; text-decoration: none;">Examples</a>
    <a href="/about" style="color: #9b59b6; margin: 0 20px; text-decoration: none;">About</a>
    <a href="/docs" style="color: #9b59b6; margin: 0 20px; text-decoration: none;">API Docs</a>
</nav>
    
    <h1>Claim Checker</h1>
    <textarea id="inputText" placeholder="Enter text to analyze..."></textarea>
    <button id="analyzeBtn" onclick="analyzeText()">Analyze</button>
    
    <div class="spinner" id="spinner"></div>
    <div id="result"></div>

    <script>
        async function analyzeText() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                document.getElementById('result').innerHTML = "Please enter some text to analyze.";
                return;
            }

            const resultDiv = document.getElementById('result');
            const spinner = document.getElementById('spinner');
            const btn = document.getElementById('analyzeBtn');

            // Show loading state
            if (response.ok) {
    const res = data.result;

    // Create visual elements
    let html = `
        <h3 style="margin-bottom: 10px; color: #bb86fc;">Analysis Result</h3>
        
        <div style="margin: 20px 0;">
            <strong>Bias Score: ${res.bias_score.toFixed(2)}</strong>
            <div style="width: 100%; background: #333; border-radius: 8px; overflow: hidden; margin-top: 8px;">
                <div style="
                    width: ${res.bias_score * 100}%;
                    height: 30px;
                    background: linear-gradient(to right, #4CAF50, #FFEB3B, #F44336);
                    transition: width 1s ease-in-out;
                    border-radius: 8px;
                "></div>
            </div>
            <p style="font-size: 0.9em; color: #aaa; margin-top: 5px;">
                Low (green) ← → High (red)
            </p>
        </div>

        <div style="margin: 20px 0;">
            <strong>Confidence: ${res.confidence.toFixed(2)}</strong>
            <div style="width: 100%; background: #333; border-radius: 8px; overflow: hidden; margin-top: 8px;">
                <div style="
                    width: ${res.confidence * 100}%;
                    height: 20px;
                    background: #9b59b6;
                "></div>
            </div>
        </div>

        <div style="margin: 20px 0; padding: 15px; background: #2c2c3e; border-radius: 8px;">
            <strong>Verdict:</strong><br>
            ${res.verdict}
        </div>
    `;

    resultDiv.innerHTML = html;
}
            spinner.style.display = "block";
            btn.disabled = true;
            btn.textContent = "Analyzing...";

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `<pre>${JSON.stringify(data.result, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `Error: ${data.error || 'Something went wrong'}`;
                }
            } catch (err) {
                resultDiv.innerHTML = `Connection error: ${err.message}`;
            } finally {
                // Hide loading state
                spinner.style.display = "none";
                btn.disabled = false;
                btn.textContent = "Analyze";
            }
        }
    </script>
    <footer style="margin-top: 80px; padding: 20px; text-align: center; color: #888; font-size: 0.9em; border-top: 1px solid #444;">
    <p>Claim Checker – Built with ❤️ by Joseph Herrmann</p>
    <p><a href="https://github.com/thenecronwolf-blip/Claim-Checker" style="color: #9b59b6; text-decoration: none;">View on GitHub</a> • 
    6th project for the Grok system • © 2025</p>
    <p>Helping promote balanced information, one claim at a time.</p>
</footer>
</body>
</html>
