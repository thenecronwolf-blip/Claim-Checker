<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e1e2f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            margin: 0;
        }
        h1 { color: #9b59b6; font-size: 2.5em; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        
        textarea {
            width: 100%;
            max-width: 600px;
            height: 120px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #2c2c3e;
            color: white;
            font-size: 16px;
            transition: border 0.3s;
            outline: none;
        }
        textarea:focus { border-color: #9b59b6; }

        button {
            background: #9b59b6;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover { background: #8e44ad; transform: translateY(-2px); }
        button:disabled { background: #666; cursor: not-allowed; }

        #result {
            margin-top: 30px;
            width: 100%;
            max-width: 600px;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .meter-container {
            width: 100%;
            background: #333;
            border-radius: 10px;
            height: 12px;
            margin: 10px 0;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            transition: width 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .spinner {
            border: 4px solid #2c2c3e;
            border-top: 4px solid #9b59b6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav style="margin-bottom: 40px; text-align: center;">
        <a href="/" style="color: #9b59b6; margin: 0 20px; text-decoration: none; font-weight: bold;">Home</a>
        <a href="/examples" style="color: #9b59b6; margin: 0 20px; text-decoration: none;">Examples</a>
        <a href="/about" style="color: #9b59b6; margin: 0 20px; text-decoration: none;">About</a>
        <a href="/docs" style="color: #9b59b6; margin: 0 20px; text-decoration: none;">API Docs</a>
    </nav>
    
    <h1>Claim Checker</h1>
    <p class="subtitle">AI-powered objectivity and bias analysis</p>
    
    <textarea id="inputText" placeholder="Paste a claim, news snippet, or statement here..."></textarea>
    <button id="analyzeBtn" onclick="analyzeText()">Analyze Statement</button>
    
    <div class="spinner" id="spinner"></div>
    <div id="result"></div>

    <script>
    // Global function to copy report
    function copyReport() {
        const verdict = document.getElementById('verdictText').innerText;
        const confidence = document.getElementById('confValue').innerText;
        const text = `🔍 Claim Analysis Report\nVerdict: ${verdict}\nConfidence: ${confidence}%\nVerified via Claim-Checker.onrender.com`;
        
        navigator.clipboard.writeText(text).then(() => {
            alert("Report copied to clipboard!");
        });
    }

async function analyzeText() {
    // ... setup ...
    const fetchAnalysis = async () => {
        return await fetch('/analyze', {
             method: 'POST',
             headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify({ text })
        });
    };

    let attempts = 0;
    const maxAttempts = 5;

    while (attempts < maxAttempts) {
        try {
            const response = await fetchAnalysis();
            
            // If 503, the server is telling us to wait.
            if (response.status === 503) {
                const data = await response.json();
                const waitTime = data.estimated_time || 20;
                
                btn.textContent = `AI Waking Up... (${waitTime.toFixed(0)}s)`;
                
                // Wait here in the browser, NOT on the server
                await new Promise(r => setTimeout(r, (waitTime * 1000)));
                attempts++;
                continue; // Loop back and try again
            }

            // If success, show results and break loop
            if (response.ok) {
                const data = await response.json();
                // ... Render your result HTML here ...
                return; 
            }
        } catch (e) {
            console.error(e);
        }
    }
    
    resultDiv.innerHTML = "Server timed out. Please try again.";
}

    resultDiv.style.opacity = "0";
    spinner.style.display = "block";
    btn.disabled = true;
    btn.textContent = "Connecting to AI...";

    // Helper function to handle the fetch
    const fetchAnalysis = async () => {
        const response = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        return response;
    };

    try {
        let response = await fetchAnalysis();
        let data = await response.json();

        // If the model is loading (503), wait 10 seconds and try one more time automatically
        if (response.status === 503) {
            btn.textContent = "AI Warming Up (10s)...";
            await new Promise(resolve => setTimeout(resolve, 10000));
            response = await fetchAnalysis();
            data = await response.json();
        }

        if (response.ok) {
            const res = data.result;
            const biasColor = res.bias_score > 0.6 ? '#f44336' : res.bias_score > 0.3 ? '#ffeb3b' : '#4caf50';
            
            resultDiv.innerHTML = `
                <div style="background: #2c2c3e; padding: 25px; border-radius: 15px; border: 1px solid #444;">
                    <h3 style="margin: 0 0 20px 0; color: #9b59b6; border-bottom: 1px solid #444; padding-bottom: 10px;">Analysis Report</h3>
                    <div style="margin-bottom: 25px;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.9em;">
                            <span>Bias Intensity</span>
                            <span style="color: ${biasColor}">${(res.bias_score * 100).toFixed(0)}%</span>
                        </div>
                        <div class="meter-container"><div id="biasMeter" class="meter-fill" style="background: ${biasColor};"></div></div>
                    </div>
                    <div style="margin-bottom: 25px;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.9em;">
                            <span>AI Confidence</span>
                            <span><span id="confValue">${(res.confidence * 100).toFixed(0)}</span>%</span>
                        </div>
                        <div class="meter-container"><div id="confMeter" class="meter-fill" style="background: #9b59b6;"></div></div>
                    </div>
                    <div style="background: #1e1e2f; padding: 15px; border-radius: 10px;">
                        <strong style="color: #888; font-size: 0.8em; text-transform: uppercase;">Verdict</strong>
                        <p id="verdictText" style="margin: 10px 0 0 0; line-height: 1.5; min-height: 1.5em;"></p>
                    </div>
                    <button onclick="copyReport()" style="background: #333; font-size: 0.8em; margin-top: 20px; padding: 8px 15px; border-radius: 20px; color: #ccc; border: 1px solid #444;">📋 Copy Report</button>
                </div>
            `;
            
            resultDiv.style.opacity = "1";
            setTimeout(() => {
                document.getElementById('biasMeter').style.width = (res.bias_score * 100) + "%";
                document.getElementById('confMeter').style.width = (res.confidence * 100) + "%";
            }, 100);

            let i = 0;
            const target = document.getElementById('verdictText');
            function typeWriter() {
                if (i < res.verdict.length) {
                    target.innerHTML += res.verdict.charAt(i);
                    i++;
                    setTimeout(typeWriter, 25);
                }
            }
            typeWriter();

        } else {
            resultDiv.style.opacity = "1";
            resultDiv.innerHTML = `<p style="color: #ff6b6b;">${data.error || 'The AI is taking a nap. Try again in a moment!'}</p>`;
        }
    } catch (err) {
        resultDiv.style.opacity = "1";
        resultDiv.innerHTML = `<p style="color: #ff6b6b;">Connection error: ${err.message}</p>`;
    } finally {
        spinner.style.display = "none";
        btn.disabled = false;
        btn.textContent = "Analyze Statement";
    }
}

    // Handle Example redirects
    window.onload = () => {
        const pending = localStorage.getItem('pendingClaim');
        if (pending) {
            document.getElementById('inputText').value = pending;
            localStorage.removeItem('pendingClaim');
            analyzeText();
        }
    }
</script>

<footer style="margin-top: 80px; padding: 30px; text-align: center; color: #666; font-size: 0.85em; border-top: 1px solid #333; width: 100%;">
    <p>Claim Checker • Built with 💙 by Joseph Herrmann</p>
    <p>
        <a href="https://github.com/thenecronwolf-blip/Claim-Checker" style="color: #9b59b6; text-decoration: none;">GitHub</a> • 
        <a href="/docs" style="color: #9b59b6; text-decoration: none;">API Access</a>
    </p>
    <p>© 2025 Grok System Development</p>
</footer>
</body>
</html>
