<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e1e2f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            margin: 0;
            min-height: 100vh; /* Ensures footer stays at bottom */
        }
        textarea {
            width: 100%;
            max-width: 600px;
            height: 120px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #2c2c3e;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }
        textarea:focus { border-color: #9b59b6; }
        
        button {
            background: #9b59b6;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); background: #8e44ad; }
        button:disabled { background: #666; cursor: wait; transform: none; }
        
        .meter-container {
            width: 100%; background: #333; height: 10px; border-radius: 5px; margin-top: 5px;
        }
        .meter-fill {
            height: 100%; width: 0%; transition: width 1s ease; border-radius: 5px;
        }
        #result { opacity: 0; transition: opacity 0.5s; margin-top: 20px; max-width: 600px; width: 100%; }
        
        /* Spinner */
        .spinner {
            border: 4px solid #333; border-top: 4px solid #9b59b6; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite;
            margin: 20px auto; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav style="margin-bottom: 40px;">
        <a href="/" style="color:#9b59b6; margin:0 15px; text-decoration:none; font-weight:bold;">Home</a>
        <a href="/examples" style="color:#9b59b6; margin:0 15px; text-decoration:none;">Examples</a>
        <a href="/about" style="color:#9b59b6; margin:0 15px; text-decoration:none;">About</a>
    </nav>

    <h1 style="color:#9b59b6;">Claim Checker</h1>
    <textarea id="inputText" placeholder="Paste a claim here..."></textarea>
    <button id="analyzeBtn" onclick="startAnalysis()">Analyze</button>
    
    <div class="spinner" id="spinner"></div>
    <div id="result"></div>

    <div style="flex-grow: 1;"></div> <footer style="margin-top: 60px; padding: 30px; text-align: center; color: #666; font-size: 0.85em; border-top: 1px solid #333; width: 100%; max-width: 800px;">
        <p>Claim Checker • Built with 💙 by Joseph Herrmann</p>
        <p>
            <a href="https://github.com/thenecronwolf-blip/Claim-Checker" style="color: #9b59b6; text-decoration: none;">GitHub</a> • 
            <a href="/docs" style="color: #9b59b6; text-decoration: none;">API Access</a>
        </p>
        <p>© 2025 Grok System Development</p>
    </footer>

    <script>
        async function startAnalysis() {
            const text = document.getElementById('inputText').value.trim();
            const resultDiv = document.getElementById('result');
            const spinner = document.getElementById('spinner');
            const btn = document.getElementById('analyzeBtn');

            if (!text) {
                alert("Please enter some text first!");
                return;
            }

            resultDiv.style.opacity = "0";
            spinner.style.display = "block";
            btn.disabled = true;
            btn.textContent = "Analyzing...";

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    // Check for "Model loading" specific error
                    if (response.status === 503 && data.error === "Model loading") {
                         throw new Error(`AI is warming up (approx ${Math.ceil(data.estimated_time)}s). Please try again in a moment.`);
                    }
                    throw new Error(data.error || `Server Error: ${response.status}`);
                }

                renderSuccess(data.result, resultDiv);

            } catch (err) {
                resultDiv.innerHTML = `<p style="color: #ff6b6b; text-align: center; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 8px;">${err.message}</p>`;
                resultDiv.style.opacity = "1";
            } finally {
                spinner.style.display = "none";
                btn.disabled = false;
                btn.textContent = "Analyze";
            }
        }

        function renderSuccess(res, container) {
            const biasColor = res.bias_score > 0.5 ? '#f44336' : '#4caf50';
            
            container.innerHTML = `
                <div style="background: #2c2c3e; padding: 25px; border-radius: 12px; border: 1px solid #444;">
                    <h3 style="margin-top:0; color:#9b59b6;">Analysis Complete</h3>
                    
                    <p><strong>Bias Score:</strong> ${(res.bias_score * 100).toFixed(0)}%</p>
                    <div class="meter-container"><div class="meter-fill" style="width:${res.bias_score * 100}%; background:${biasColor}"></div></div>
                    
                    <p><strong>Confidence:</strong> ${(res.confidence * 100).toFixed(0)}%</p>
                    <div class="meter-container"><div class="meter-fill" style="width:${res.confidence * 100}%; background:#9b59b6"></div></div>
                    
                    <div style="margin-top: 20px; padding: 15px; background: #1e1e2f; border-radius: 8px;">
                        <strong>Verdict:</strong>
                        <p id="typewriterText" style="margin: 5px 0 0 0;">${res.verdict}</p>
                    </div>
                </div>
            `;
            container.style.opacity = "1";
        }

        window.onload = function() {
            const pending = localStorage.getItem('pendingClaim');
            if (pending) {
                document.getElementById('inputText').value = pending;
                localStorage.removeItem('pendingClaim');
                startAnalysis();
            }
        }
    </script>
</body>
</html>
